[package]
name = "rtd"
description = "Facade crate re-exporting the rtd public surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rtd-client = { path = "../rtd-client", default-features = false }
rtd-error = { path = "../rtd-error" }
rtd-tg = { path = "../rtd-tg" }

[features]
default = ["media-webrtc"]
media-webrtc = ["rtd-client/media-webrtc"]
