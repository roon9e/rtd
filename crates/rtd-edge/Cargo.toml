[package]
name = "rtd-edge"
description = "Sidecar MTProto edge service binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rtd-crypto = { path = "../rtd-crypto" }
rtd-edge-proto = { path = "../rtd-edge-proto" }
rtd-error = { path = "../rtd-error" }
rtd-exchange = { path = "../rtd-exchange" }
rtd-server = { path = "../rtd-server" }
rtd-tlprofile = { path = "../rtd-tlprofile" }
rtd-transport = { path = "../rtd-transport" }
rtd-util = { path = "../rtd-util" }
futures-util = "0.3"
prost = "0.13"
rsa = "0.9"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
] }
tonic = "0.12"

[dev-dependencies]
rtd-bin = { path = "../rtd-bin" }
rtd-tg = { path = "../rtd-tg" }
rand = "0.8"
