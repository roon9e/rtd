[package]
name = "rtd-client"
description = "MTProto 2.0 client runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rtd-bin = { path = "../rtd-bin" }
rtd-crypto = { path = "../rtd-crypto" }
rtd-error = { path = "../rtd-error" }
rtd-exchange = { path = "../rtd-exchange" }
rtd-mt = { path = "../rtd-mt" }
rtd-proto = { path = "../rtd-proto" }
rtd-tg = { path = "../rtd-tg" }
rtd-transport = { path = "../rtd-transport" }
rtd-util = { path = "../rtd-util" }
tokio = { version = "1", features = ["sync"] }
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
num-bigint = "0.4"
zeroize = "1"
webrtc = { version = "0.11", optional = true }
bytes = { version = "1", optional = true }
opentelemetry = { version = "0.27", optional = true }

[features]
default = ["media-webrtc"]
media-webrtc = ["dep:webrtc", "dep:bytes", "tokio/rt-multi-thread", "tokio/time"]
otel = ["dep:opentelemetry"]
ntp = ["rtd-util/ntp"]

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["rt"] }
