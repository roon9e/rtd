name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is a separate job so a formatting failure does not hide the
  # results of the other independent checks.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy denies warnings (the workspace lint baseline sets clippy::all = deny);
  # -D warnings makes any remaining rustc lint fail the job too.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # Independent check that committed generated sources match what the
  # generator produces: regenerate and fail if anything changed.
  generation-freshness:
    name: generation freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p rtd-codegen -- generate
      - run: git diff --exit-code

  # External-peer interop: build the official Rust MTProto engine's test server
  # and run the peer gates against it over a real socket. The engine is GPL-2.0
  # and is never linked or vendored; it is built in a separate checkout and run
  # as a peer only. Non-blocking while the pinned ref and toolchain settle.
  interop:
    name: interop (external peer)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the official MTProto engine test server
        run: |
          git clone --depth 1 https://github.com/TelegramMessenger/mtproto-engine "$RUNNER_TEMP/engine"
          cargo build --release -p mtproto-testserver --manifest-path "$RUNNER_TEMP/engine/Cargo.toml"
      - name: Run the exchange and client peer gates
        env:
          RTD_PEER_TESTSERVER: ${{ runner.temp }}/engine/target/release/mtproto-testserver
        run: |
          cargo test -p rtd-exchange --test peer_gate
          cargo test -p rtd-client --test peer_gate

  # Go cross-check vectors: regenerate and fail on diff. Non-blocking while the
  # toolchain is pinned.
  vectors:
    name: interop vectors
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Regenerate the Go cross-check vectors
        working-directory: interop/vectors
        run: go run . > ../vectors.json
      - run: git diff --exit-code
