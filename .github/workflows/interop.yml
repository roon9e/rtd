name: Interop

# Manual-only external-peer and cross-check jobs. These are intentionally not
# part of the push/PR CI: building the official MTProto engine's test server is
# heavy, and the Go vectors job needs a pinned toolchain. Run them on demand
# (`gh workflow run Interop`) or before a release.
on:
  workflow_dispatch:
    inputs:
      edge_image:
        description: rtd-edge image to smoke (proven tag)
        required: false
        default: ghcr.io/roon9e/rtd-edge:v0.1.1

permissions:
  contents: read
  packages: read

jobs:
  # Build the official Rust MTProto engine's test server and run the rtd peer
  # gates against it over a real socket. The engine is GPL-2.0 and is never
  # linked or vendored; it is built in a separate checkout and run as a peer.
  external-peer:
    name: external peer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the official MTProto engine test server
        run: |
          git clone --depth 1 https://github.com/TelegramMessenger/mtproto-engine "$RUNNER_TEMP/engine"
          cargo build --release -p mtproto-testserver --manifest-path "$RUNNER_TEMP/engine/Cargo.toml"
      - name: Run the exchange and client peer gates
        env:
          RTD_PEER_TESTSERVER: ${{ runner.temp }}/engine/target/release/mtproto-testserver
        run: |
          cargo test -p rtd-exchange --test peer_gate
          cargo test -p rtd-client --test peer_gate

  # Regenerate the Go cross-check vectors and fail on diff.
  vectors:
    name: vectors freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check out the Go reference (module replace target)
        run: git clone --depth 1 https://github.com/iamxvbaba/td "$GITHUB_WORKSPACE/../td"
      - name: Regenerate the Go cross-check vectors
        working-directory: interop/vectors
        run: go run . > ../vectors.json
      - run: git diff --exit-code

  # Drive the rtd client through the *published* rtd-edge image in front of the
  # pinned gramsrv v2 core, without building the edge from source. The edge
  # repository is moving to its own project, so this manual smoke pins the
  # proven image tag rather than the rtd-edge source tree.
  drop-in:
    name: drop-in smoke (proven images)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the gramsrv v2 stack
        run: git clone --depth 1 --branch v2 https://github.com/iamxvbaba/gramsrv "$RUNNER_TEMP/gramsrv"

      - name: Pin the rtd-edge image
        env:
          EDGE_IMAGE: ${{ inputs.edge_image }}
        run: |
          cd "$RUNNER_TEMP/gramsrv"
          sed -i -E "s#image: ghcr.io/roon9e/rtd-edge:[^ ]+#image: ${EDGE_IMAGE}#" \
            deploy/docker/compose.rtd-edge.yaml
          grep -n 'rtd-edge' deploy/docker/compose.rtd-edge.yaml

      - name: Generate the stack .env
        run: |
          cd "$RUNNER_TEMP/gramsrv"
          ./scripts/new-docker-env.sh --advertise-ip 127.0.0.1 --output deploy/docker/.env

      - name: Pull the pinned images
        run: |
          cd "$RUNNER_TEMP/gramsrv/deploy/docker"
          docker compose --env-file .env -f compose.yaml -f compose.rtd-edge.yaml \
            pull postgres redis migrate file core edge

      - name: Bring up the stack
        run: |
          cd "$RUNNER_TEMP/gramsrv/deploy/docker"
          docker compose --env-file .env -f compose.yaml -f compose.rtd-edge.yaml \
            up -d --no-build postgres redis migrate file core edge
          for _ in $(seq 1 60); do
            if bash -c 'exec 3<>/dev/tcp/127.0.0.1/2398' 2>/dev/null; then
              echo "edge is listening on 2398"
              exit 0
            fi
            sleep 5
          done
          echo "edge did not start listening" >&2
          exit 1

      - name: Run the client drop-in smoke
        env:
          RTD_EDGE_ADDR: 127.0.0.1:2398
          RTD_EDGE_LAYER: "229"
          RTD_EDGE_CODEC: abridged
          RTD_EDGE_OBFUSCATED: "1"
          RTD_EDGE_PUBLIC_KEY: ${{ runner.temp }}/gramsrv/deploy/docker/assets/test-server-rsa.pub
        run: cargo run -p rtd-client --example edge_e2e

      - name: Dump stack logs on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/gramsrv/deploy/docker"
          docker compose --env-file .env -f compose.yaml -f compose.rtd-edge.yaml \
            logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: |
          cd "$RUNNER_TEMP/gramsrv/deploy/docker"
          docker compose --env-file .env -f compose.yaml -f compose.rtd-edge.yaml down -v
